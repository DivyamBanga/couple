<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F0">
  <meta name="description" content="a tiny arcade for two 💘">
  <title>div &amp; diya dungeon</title>
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
  <script>
    // QA identity override — must run BEFORE any module reads storage.
    // ?as=divyam / ?as=diya makes this tab act as that player with isolated storage.
    (function () {
      var m = location.search.match(/[?&]as=(divyam|diya)\b/);
      if (m) sessionStorage.setItem('cpl.testAs', m[1]);
    })();
  </script>
</head>
<body>
  <div class="deco" aria-hidden="true">
    <span style="top:6%;  left:4%;">🩷</span>
    <span style="top:12%; right:6%;">✨</span>
    <span style="top:38%; left:2%;"  class="deco-wide">💌</span>
    <span style="top:56%; right:3%;" class="deco-wide">🫧</span>
    <span style="top:78%; left:5%;"  class="deco-wide">⭐</span>
    <span style="bottom:8%; right:8%;">💗</span>
  </div>

  <main id="app"></main>
  <div id="overlays"></div>

  <noscript style="display:block;text-align:center;padding:40px;font-family:sans-serif;">
    this little arcade needs JavaScript to run 💔
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
